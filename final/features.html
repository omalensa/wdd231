<body>
  <header>
    <div class="logo-container">
      <img src="images/logo.webp" alt="SafeGuard NG logo" width="50" height="50">
      <span>SafeGuard NG</span>
    </div>
    <button id="menu-button" aria-label="Open navigation menu">☰</button>

  <nav id="primary-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="features.html" class="active" aria-current="page">Features</a></li>

  </nav>

  <main>
    <h1>Safety Features & Tips</h1>
    <p class="intro">Explore practical ways to stay safer. Filter by category or click any tip to learn more.</p>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="personal">Personal</button>
      <button class="filter-btn" data-filter="family">Family</button>
      <button class="filter-btn" data-filter="travel">Travel</button>
      <button class="filter-btn" data-filter="community">Community</button>
    </div>

    <!-- Dynamic Tips Grid -->
    <div id="tips-container" class="tips-grid">
      <!-- Tips will be loaded here by JavaScript -->
    </div>
  </main>

  <!-- Modal -->
  <dialog id="tip-modal">
    <button class="close-modal" aria-label="Close">×</button>
    <h2 id="modal-title"></h2>
    <p id="modal-category"></p>
    <p id="modal-level"></p>
    <p id="modal-description"></p>
  </dialog>
